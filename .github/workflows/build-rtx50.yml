name: Build Ling-3.0-tiny Server for RTX 50 Series

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release 版本号（如 v1.0.0）'
        required: true
        default: 'v1.0.0'
        type: string
      cuda_version:
        description: 'CUDA 版本（如 12.8.1）'
        required: false
        default: '12.8.1'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  build:
    runs-on: windows-2022
    permissions:
      actions: write
      contents: write

    steps:
      # 0. 安装 CUDA Toolkit
      - name: Install CUDA Toolkit ${{ inputs.cuda_version }}
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: ${{ inputs.cuda_version }}
          method: 'network'
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev"]'

      # 1. 拉取 aetherbird/llama.cpp 最新代码
      - name: Checkout aetherbird/llama.cpp (bailingmoe3-support)
        uses: actions/checkout@v4
        with:
          repository: aetherbird/llama.cpp
          ref: bailingmoe3-support
          submodules: recursive
          path: src

      # 2. 编译（同会话：MSVC + 屏蔽MinGW + CMake + Build）
      - name: Build llama-server (Windows + CUDA + sm_120)
        shell: cmd
        run: |
          echo ================================================================
          echo [1/6] 加载 MSVC x64 环境
          echo ================================================================
          for /f "delims=" %%i in ('"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath') do set "VS_PATH=%%i"
          set "VCVARS=%VS_PATH%\VC\Auxiliary\Build\vcvars64.bat"
          if not exist "%VCVARS%" (echo ❌ 未找到 %VCVARS% && exit /b 1)
          call "%VCVARS%"
          if %ERRORLEVEL% neq 0 (echo ❌ MSVC 环境加载失败 && exit /b 1)
          where cl.exe || (echo ❌ cl.exe 未加载 && exit /b 1)
          for /f "delims=" %%i in ('where cl.exe') do set "CL_PATH=%%i"
          echo ✅ MSVC cl.exe: %CL_PATH%

          echo ================================================================
          echo [2/6] 从 PATH 中剔除预装 MinGW
          echo ================================================================
          set "PATH=%PATH:C:\mingw64\bin;=%"
          set "PATH=%PATH:;C:\mingw64\bin=%"
          set "PATH=%PATH:C:\mingw64\bin=%"
          set "PATH=%PATH:C:\msys64\mingw64\bin;=%"
          set "PATH=%PATH:;C:\msys64\mingw64\bin=%"
          set "PATH=%PATH:C:\msys64\mingw64\bin=%"
          set "PATH=%PATH:C:\msys64\ucrt64\bin;=%"
          set "PATH=%PATH:;C:\msys64\ucrt64\bin=%"
          set "PATH=%PATH:C:\msys64\ucrt64\bin=%"
          where cc.exe && (
            for %%i in (cc.exe gcc.exe g++.exe) do (
              for /f "delims=" %%j in ('where %%i 2^>nul') do del /f /q "%%j" || echo 删除 %%j 失败
            )
          ) || echo ✅ cc.exe 已在 PATH 中消失
          where cc.exe && (echo ❌ cc.exe 仍存在 && exit /b 1) || echo ✅ MinGW 屏蔽成功

          echo ================================================================
          echo [3/6] 安装依赖 + 验证 CUDA
          echo ================================================================
          echo CUDA_PATH: %CUDA_PATH%
          set "CUDA_BIN=%CUDA_PATH%\bin"
          if not exist "%CUDA_BIN%\nvcc.exe" (
            echo ❌ %CUDA_BIN%\nvcc.exe 不存在！
            dir "%CUDA_BIN%"
            exit /b 1
          )
          echo ✅ CUDA bin 目录：%CUDA_BIN%
          set "PATH=%CUDA_BIN%;%PATH%"

          choco install openssl ninja -y --no-progress
          where ninja || (echo ❌ ninja 未安装 && exit /b 1)
          where nvcc || (echo ❌ nvcc 仍未找到 && exit /b 1)
          nvcc --version
          echo ✅ 依赖就绪

          echo ================================================================
          echo [4/6] CMake 配置（强制使用 MSVC，Blackwell sm_120）
          echo ================================================================
          cd src
          if exist build rmdir /s /q build
          mkdir build
          cmake -S . -B build -G "Ninja Multi-Config" ^
            -DCMAKE_C_COMPILER="%CL_PATH%" ^
            -DCMAKE_CXX_COMPILER="%CL_PATH%" ^
            -DCMAKE_CUDA_COMPILER="%CUDA_BIN%\nvcc.exe" ^
            -DCMAKE_C_COMPILER_WORKS=ON ^
            -DCMAKE_CXX_COMPILER_WORKS=ON ^
            -DGGML_CUDA=ON ^
            -DCMAKE_CUDA_ARCHITECTURES="120" ^
            -DGGML_CUDA_FA_ALL_QUANTS=ON ^
            -DGGML_NATIVE=OFF ^
            -DLLAMA_BUILD_SERVER=ON ^
            -DLLAMA_BUILD_TOOLS=ON ^
            -DLLAMA_BUILD_BORINGSSL=OFF ^
            -DOPENSSL_USE_STATIC_LIBS=ON ^
            -DOPENSSL_ROOT_DIR="C:\Program Files\OpenSSL" ^
            -DCMAKE_C_FLAGS="/MT" ^
            -DCMAKE_CXX_FLAGS="/MT" ^
            -DCMAKE_VERBOSE_MAKEFILE=ON
          if %ERRORLEVEL% neq 0 (echo ❌ CMake 配置失败 && exit /b 1)
          echo ✅ CMake 配置完成

          echo ================================================================
          echo [5/6] 编译 llama-server
          echo ================================================================
          set /A NINJA_JOBS=%NUMBER_OF_PROCESSORS%-1
          cmake --build build --config Release -j %NINJA_JOBS% -t llama-server
          if %ERRORLEVEL% neq 0 (echo ❌ 编译失败 && exit /b 1)
          echo 🎉🎉🎉 编译成功！

          echo ================================================================
          echo [6/6] 收集产物到 out 目录
          echo ================================================================
          mkdir out
          copy build\bin\Release\llama-server.exe out\
          copy build\bin\Release\*.dll out\
          copy "%CUDA_PATH%\bin\cudart64_*.dll" out\
          copy "%CUDA_PATH%\bin\cublas64_*.dll" out\
          copy "%CUDA_PATH%\bin\cublasLt64_*.dll" out\
          copy "C:\Windows\System32\vcruntime140.dll" out\
          copy "C:\Windows\System32\vcruntime140_1.dll" out\
          copy "C:\Windows\System32\msvcp140.dll" out\
          copy "C:\Windows\System32\msvcp140_1.dll" out\
          copy "C:\Windows\System32\msvcp140_2.dll" out\
          copy "C:\Windows\System32\concrt140.dll" out\
          echo === 产物列表 ===
          dir out\

      # 3. 把产物上传为 artifact（关键修复：用 artifact 传递文件）
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llama-server-rtx50
          path: src/out/
          retention-days: 7

      # 4. 下载 artifact 并打包发布（独立步骤，确保文件路径正确）
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: llama-server-rtx50
          path: release-files

      - name: Package release zip
        shell: pwsh
        run: |
          echo "=== 准备打包的文件 ==="
          Get-ChildItem -Path "release-files" -Recurse | Format-Table FullName, Length
          
          $zipName = "llama-server-rtx50-cuda12.8-${{ inputs.tag_name }}.zip"
          Compress-Archive -Path "release-files\*" -DestinationPath $zipName -Force
          
          echo "=== 最终 zip 文件 ==="
          Get-Item $zipName | Format-List Name, Length
          
          # 把 zip 移到工作目录根下，方便 release action 引用
          echo "ZIP_PATH=$zipName" >> $env:GITHUB_ENV

      # 5. 发布 Release（用环境变量引用文件路径）
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: Ling-3.0-tiny Server ${{ inputs.tag_name }} — Windows RTX 50 Series
          body: |
            ## 🐦 Ling-3.0-tiny Windows 版（RTX 50 Series / Blackwell sm_120）
            基于 [aetherbird/llama.cpp](https://github.com/aetherbird/llama.cpp/tree/bailingmoe3-support) 的 `bailingmoe3-support` 分支自动编译。

            ### ✨ 核心特性
            - **CUDA 12.8 + sm_120**：Blackwell 架构原生编译，适配全 RTX 50 系桌面显卡
            - **Windows 原生**：无需 WSL，直接调用显卡驱动
            - **开箱即用**：内置所有依赖 DLL，解压即跑
            - **MoE 优化**：Flash Attention 全量化内核

            ### 💻 显存适配参考
            | 显存 | 适用显卡 | 推荐模型 |
            |---|---|---|
            | 8GB | RTX 5050/5060 | 7B-14B 量化模型 |
            | 16GB | RTX 5060Ti/5070/5080 | 14B-32B 量化模型 |
            | 32GB | RTX 5090 | 70B 以内量化模型 |

            ### 🚀 快速使用
            1. 下载下方 zip 解压到纯英文目录
            2. 放入 Ling-3.0-tiny GGUF 模型
            3. PowerShell 运行：
            ```powershell
            .\llama-server.exe -m your_model.gguf --jinja --host 0.0.0.0 --port 8080 -ngl 999 -t 16
            ```
            4. 浏览器访问 `http://localhost:8080`
          files: |
            ${{ env.ZIP_PATH }}
            release-files/llama-server.exe
            release-files/*.dll
